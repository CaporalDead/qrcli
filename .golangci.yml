# golangci-lint v2 configuration.
# `default: standard` enables errcheck, govet, ineffassign, staticcheck, unused.
version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    # Keep the sane defaults: no errcheck noise on fmt.Fprint* & friends.
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CaporalDead/qrcli
